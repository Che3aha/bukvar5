function letterButtons(arr){return '<div class="gridletters">'+arr.map(l=>{let i=letters.indexOf(l),n=state.earned.filter(x=>x.startsWith('l'+i+'-')).length;return '<button class="letter '+(n>=5?'done':'')+'" data-letter="'+i+'" aria-label="Слово '+l[0]+', '+l[1]+'">'+l[0]+'<small>'+n+'/5</small></button>'}).join('')+'</div>'}
function bindLetters(){document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>lesson(+b.dataset.letter))}
function letterMap(){app.innerHTML='<div class="sectionhead"><h2>Путовање кроз буквар</h2><span class="muted">Редослед увођења слова из књиге</span></div><p class="instructions">Изабери било које слово. У свакој станици те чека пет малих задатака.</p>'+letterButtons(letters)+'<p class="source">Штампана слова: стр. 18–66 приложеног буквара. За игру су направљене нове илустрације и нови задаци.</p>';bindLetters()}
const modes=[['learn','1. Откриј'],['initial','2. Прво слово'],['case','3. Велико и мало'],['build','4. Сложи реч'],['trace','5. Пиши']];
function lesson(i,m='learn'){stopAudio();current=i;mode=m;locked=false;round=0;let l=letters[i];app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Сва слова</button><span class="muted">Станица '+(i+1)+' / 30 · '+l[1]+'</span><div><button class="small" id="prev" aria-label="Претходно слово">←</button> <button class="small" id="nextletter" aria-label="Следеће слово">→</button></div></div><div class="tabs">'+modes.map(x=>'<button class="tab '+(m===x[0]?'active':'')+'" data-mode="'+x[0]+'">'+x[1]+(state.earned.includes('l'+i+'-'+x[0])?' ✓':'')+'</button>').join('')+'</div><section class="workspace" id="work"></section><p class="source">Основа: '+l[0]+' — '+l[1]+', стр. '+l[3]+' буквара. Вежбе користе штампану ћирилицу.</p>';$('#back').onclick=()=>nav('letters');$('#prev').onclick=()=>lesson((i+29)%30);$('#nextletter').onclick=()=>lesson((i+1)%30);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>lesson(i,b.dataset.mode));renderExercise()}
function feedback(t){let f=$('#feedback');if(f)f.textContent=t;$('#live').textContent=t}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function options(correct,pool){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,2)])}
function renderExercise(){let l=letters[current],w=$('#work');locked=false;let lower=l[0].toLowerCase(), end='<div class="feedback" id="feedback" role="status"></div>';
if(mode==='learn'){w.innerHTML='<div class="lesson-layout"><div><div class="eyebrow">УПОЗНАЈ НОВОГ ДРУГАРА</div><div class="bigletter">'+l[0]+lower+'</div><h2>'+l[1].toUpperCase()+'</h2><button class="small" id="listen">♫ Послушај реч</button></div><div>'+letterIllustration(l[2])+'<p>Пронађи слово <strong>'+l[0]+'</strong>.</p></div></div><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;bindReader(l[1]);answers(l[0]);}
if(mode==='initial'){w.innerHTML='<h2>Којим словом почиње ова реч?</h2>'+letterIllustration(l[2])+'<h3>'+l[1].toUpperCase()+'</h3><div class="choices">'+options(l[0],alphabet).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(l[0])}
if(mode==='case'){w.innerHTML='<h2>Пронађи мало слово.</h2>'+letterIllustration(l[2])+'<div class="bigletter">'+l[0]+'</div><p>Које мало слово је пар овом великом слову?</p><div class="choices">'+options(lower,alphabet.map(x=>x.toLowerCase())).map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>'+end;answers(lower)}
if(mode==='build'){let chars=l[1].toUpperCase().split(''),picked=[];w.innerHTML='<h2>Сложи реч од слова.</h2>'+letterIllustration(l[2])+'<p>Модел: <strong>'+l[1].toUpperCase()+'</strong></p><div class="slots" id="slots">'+chars.map(()=>'·').join('')+'</div><div class="tiles">'+shuffle(chars.map((c,i)=>({c,i}))).map(x=>'<button class="tile" data-tile="'+x.i+'">'+x.c+'</button>').join('')+'</div><div class="controls"><button class="secondary" id="undo">← Врати слово</button> <button class="primary" id="check">Провери</button></div>'+end;let update=()=>{$('#slots').textContent=picked.map(x=>chars[x]).join('')+'·'.repeat(chars.length-picked.length)};document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{if(locked)return;picked.push(+b.dataset.tile);b.disabled=true;update()});$('#undo').onclick=()=>{if(locked)return;let n=picked.pop();if(n!==undefined)$('[data-tile="'+n+'"]').disabled=false;update();feedback('')};$('#check').onclick=()=>{if(locked)return;if(picked.map(x=>chars[x]).join('')===l[1].toUpperCase())success();else feedback('Погледај модел и покушај поново. Можеш да вратиш слово.')}}
if(mode==='trace'){w.innerHTML='<h2>Прати слово '+l[0]+' прстом или мишем.</h2>'+letterIllustration(l[2])+'<p>Цртај преко бледог слова. Одрасли може да ти покаже покрете.</p><div class="canvaswrap"><canvas id="drawing" width="900" height="330" aria-label="Површина за вежбање слова"></canvas></div><div class="controls"><button class="secondary" id="clear">Обриши</button> <button class="primary" id="finished">Заврши вежбу</button> <button class="small" onclick="window.print()">Штампај</button></div><p class="muted">Ово је слободна вежба писања. Апликација не оцењује облик слова.</p>'+end;let d=setupCanvas(l[0]+' '+lower);$('#clear').onclick=()=>d.reset();$('#finished').onclick=()=>{if(!d.hasDrawn())feedback('Најпре испробај писање на површини.');else if(!locked)success('Лепо си вежбао! Покажи слово одраслом.')}}}
function answers(correct){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(b.dataset.answer===correct){b.classList.add('good');success()}else{b.classList.add('bad');b.disabled=true;feedback('Добар покушај! Погледај још једном.')}})}
function success(text='Браво! Освојио си звездицу.'){locked=true;let id='l'+current+'-'+mode;let old=state.earned.includes(id);award(id);feedback(old?'Браво! Поновио си ову вежбу.':text);let b=document.createElement('button');b.className='primary';b.textContent=mode==='trace'?'Следеће слово →':'Следећи задатак →';b.onclick=()=>{let n=modes.findIndex(x=>x[0]===mode);lesson(mode==='trace'?(current+1)%30:current,mode==='trace'?'learn':modes[n+1][0])};$('#work').append(b)}
function setupCanvas(text=''){let c=$('#drawing'),ctx=c.getContext('2d'),down=false,drawn=false;function reset(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,c.width,c.height);if(text){ctx.strokeStyle='#dce3d5';ctx.lineWidth=2;[75,255].forEach(y=>{ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(870,y);ctx.stroke()});ctx.font='bold 240px Arial';ctx.textAlign='center';ctx.fillStyle='#d9dfd1';ctx.fillText(text,450,252)}drawn=false}reset();function pos(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=ink;ctx.fill();ctx.beginPath();ctx.moveTo(x,y);drawn=true};c.onpointermove=e=>{if(!down)return;ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;return{reset,hasDrawn:()=>drawn}}

function bindStoryVideo(){const asset=JSON.parse($('#story-video-library').textContent),video=$('#turnipVideo'),button=$('#playStoryVideo');video.poster=asset.poster;storyVideoURL=asset.video;video.src=storyVideoURL;video.controls=false;video.muted=!state.sound;const update=()=>{button.textContent=video.ended?'↺ Пусти поново':video.paused?'▶ Пусти причу':'Ⅱ Заустави причу';button.setAttribute('aria-pressed',String(!video.paused))};video.onplay=video.onpause=video.onended=update;video.onerror=()=>{$('#live').textContent='Видео се није покренуо. Покушај поново.'};button.onclick=()=>{if(!video.paused){video.pause();return}stopAudio();if(video.ended)video.currentTime=0;video.muted=!state.sound;video.play().catch(()=>{$('#live').textContent='Притисни дугме за видео поново.'})};video.onclick=()=>button.click()}
const storyData=[{name:'Деда и репа',ref:'стр. 24–25',kind:'tree',text:'Деда вуче репу, али репа остаје у земљи. Бака долази да помогне. Стижу дете и мала животиња. Сви заједно извуку репу!',q:'Како су извукли репу?',a:['Заједно су помогли.','Репа је одлетела.','Нико није помогао.'],correct:0,talk:'Када си ти некоме помогао?'},{name:'На излету',ref:'стр. 30–31',kind:'rabbit',text:'Медвед, мачка и зец иду на излет. У торби носе колаче. На ливади седну да се одморе и играју се преношења поруке.',q:'Шта су понели у торби?',a:['Колаче.','Ципеле.','Кишобран.'],correct:0,talk:'Шта би ти понео на излет? Смисли смешну поруку.'},{name:'Кишобран',ref:'стр. 36',kind:'flower',text:'Почиње киша. Девојчица отвори кишобран. На стази угледа мале мраве. Она их склони од кише и насмеши се.',q:'Зашто је отворила кишобран?',a:['Падала је киша.','Падао је снег.','Да направи торту.'],correct:0,talk:'Нацртај како би ти помогао малој животињи.'},{name:'Паткино писмо',ref:'стр. 40',kind:'fish',text:'Патка плива преко реке. На глави пажљиво носи писмо. У писму је лепа порука за њеног друга.',q:'Где се налази писмо?',a:['На глави патке.','Под каменом.','На дрвету.'],correct:0,talk:'Коме би ти послао лепу поруку?'},{name:'Маме и бебе',ref:'стр. 53',kind:'cat',text:'Мачка има маче. Пас има штене. Крава има теле. Бебе расту, играју се и уче уз своје маме.',q:'Како се зове беба мачке?',a:['Маче.','Теле.','Штене.'],correct:0,talk:'Које још животињске породице познајеш?'}];
function stories(){app.innerHTML='<div class="sectionhead"><h2>Мале приче, велике идеје</h2></div><p>Нове кратке приче инспирисане темама буквара. Читај са одраслим.</p><div class="cards">'+storyData.map((s,i)=>'<button class="card" data-story="'+i+'">'+(i===0?'<img class="story-thumbnail" src="'+JSON.parse($('#story-thumbnail').textContent)+'" alt="Деда, бака, дете и зец заједно вуку репу">':i===1?'<img class="story-thumbnail" src="'+JSON.parse($('#picnic-thumbnail').textContent)+'" alt="Медвед, мачка и зец на излету са корпом колача">':i===2?'<img class="story-thumbnail" src="'+JSON.parse($('#umbrella-thumbnail').textContent)+'" alt="Девојчица са кишобраном помаже малим мравима">':i===3?'<img class="story-thumbnail" src="'+JSON.parse($('#duck-thumbnail').textContent)+'" alt="Патка носи писмо на глави">':i===4?'<img class="story-thumbnail" src="'+JSON.parse($('#families-thumbnail').textContent)+'" alt="Мачка и маче, пас и штене, крава и теле">':svg(s.kind))+'<h3>'+s.name+'</h3><p>Прочитај • одговори • испричај</p></button>').join('')+'</div>';document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>story(+b.dataset.story))}
function story(i){stopAudio();let s=storyData[i];locked=false;app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Приче</button><h2>'+s.name+'</h2></div><div class="workspace">'+(i===0?'<div class="storyscene storyvideo"><video id="turnipVideo" playsinline preload="metadata" aria-label="Анимирана прича: Деда и репа"></video></div><div class="video-actions"><button class="small" id="playStoryVideo" aria-pressed="false">▶ Пусти причу</button></div>':'<div class="storyscene">'+svg(s.kind)+'</div>')+'<div class="storytext">'+s.text+'</div><button class="small" id="listen">♫ Прочитај</button><h2>'+s.q+'</h2><div class="choices">'+shuffle(s.a.map((t,j)=>({t,j}))).map(x=>'<button class="choice word" data-story-answer="'+x.j+'">'+x.t+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div><p class="instructions"><strong>Сада ти причај:</strong> '+s.talk+'</p><button class="secondary" id="drawstory">Нацртај своју причу</button></div><p class="source">Нова поједностављена адаптација теме из буквара, '+s.ref+'.</p>';$('#back').onclick=()=>nav('stories');bindReader(s.text);if(i===0)bindStoryVideo();$('#drawstory').onclick=()=>draw('Моја прича');document.querySelectorAll('[data-story-answer]').forEach(b=>b.onclick=()=>{if(locked)return;if(+b.dataset.storyAnswer===s.correct){locked=true;b.classList.add('good');let old=state.earned.includes('story'+i);award('story'+i);feedback(old?'Тачно! Лепо си поновио причу.':'Тачно! Нова звездица за тебе.')}else{b.classList.add('bad');b.disabled=true;feedback('Прочитај причу још једном. Покушај поново.')}})}
const colors=['#eb7970','#edc765','#8fba79','#7baec9','#ac91cc','#eeb38e','#ffffff','#465447'];

function startRandomBee(){
const card=document.querySelector('[data-art="flower"]'),bee=card?.querySelector('.flying-bee');if(!bee)return;
const origin=bee.getBoundingClientRect(),box=card.getBoundingClientRect();card.append(bee);bee.classList.add('roaming-bee');
let x=origin.left-box.left,y=origin.top-box.top,flight;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const bounds=()=>({w:Math.max(12,card.clientWidth-bee.offsetWidth-12),h:Math.max(12,card.clientHeight-bee.offsetHeight-12)});
function place(){const b=bounds();x=Math.max(12,Math.min(x,b.w));y=Math.max(12,Math.min(y,b.h));bee.style.transform='translate('+x+'px,'+y+'px)';}
function fly(){if(!card.isConnected){observer.disconnect();reduced.removeEventListener('change',restart);return;}place();if(reduced.matches)return;
const b=bounds(),nx=12+Math.random()*(b.w-12),ny=12+Math.random()*(b.h-12),angle=nx>x?6:-6;
flight=bee.animate([{transform:'translate('+x+'px,'+y+'px) rotate(0deg)'},{transform:'translate('+nx+'px,'+ny+'px) rotate('+angle+'deg)'}],{duration:2600+Math.random()*1600,easing:'ease-in-out',fill:'forwards'});
flight.onfinish=()=>{x=nx;y=ny;place();flight.cancel();fly()};}
function restart(){if(flight){flight.onfinish=null;const m=new DOMMatrixReadOnly(getComputedStyle(bee).transform);x=m.m41;y=m.m42;flight.cancel();}fly();}
const observer=new ResizeObserver(restart);observer.observe(card);reduced.addEventListener('change',restart);place();
}

function artMenu(){let arts=[['cat','Шарена мачка'],['plane','Мој авион'],['flower','Љубичица'],['fish','Риба'],['frog','Жаба'],['rabbit','Зец']];app.innerHTML='<div class="sectionhead"><h2>Мала уметничка радионица</h2></div><p>Изабери боју, па кликни део слике. Или нацртај нешто сасвим своје!</p><div class="cards">'+arts.map(x=>'<button class="card" data-art="'+x[0]+'">'+(x[0]==='cat'?catIllustration():x[0]==='flower'?flowerIllustration():x[0]==='frog'?frogIllustration():x[0]==='rabbit'?bunnyIllustration():svg(x[0]))+'<h3>'+x[1]+'</h3><p>Кликни и обој →</p></button>').join('')+'</div><p><button class="primary" id="freedraw">✎ Нацртај своју породицу</button></p><p class="source">Бојење и цртање инспирисани задацима на стр. 18–21, 36, 51 и 69.</p>';document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>coloring(b.dataset.art));$('#freedraw').onclick=()=>draw('Моја породица');startRandomBee()}
function fishColoring(kind='fish'){artKind=kind;const isCat=kind==='cat',isFrog=kind==='frog',isFlower=kind==='flower',w=isCat?500:isFlower?480:isFrog?520:560,h=isCat?500:isFlower?500:isFrog?447:400,key=kind+'Drawing',title=isCat?'Оживи мачку бојама':isFlower?'Оживи љубичицу бојама':isFrog?'Оживи жабу бојама':'Оживи рибу бојама',prompt=isCat?'Изабери боју и цртај по мачки прстом или мишем.':isFlower?'Изабери боју и цртај по цвету прстом или мишем.':isFrog?'Изабери боју и цртај по жаби прстом или мишем.':'Изабери боју и цртај по риби прстом или мишем.';app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Радионица</button><h2>'+title+'</h2></div><div class="workspace"><p>'+prompt+'</p>'+palette()+'<div class="fish-paint-wrap" style="aspect-ratio:'+w+'/'+h+'"><img id="paintFish" src="'+JSON.parse(document.getElementById(kind+'-image').textContent)+'" alt="'+(isCat?'Мачка која трепће и помера реп':isFlower?'Љубичица чији се листови њишу':isFrog?'Жаба која трепће':'Риба која плива')+'">'+(isFlower?beeIllustration():'')+'<canvas id="fishPaint" width="'+w+'" height="'+h+'" aria-label="'+(isCat?'Бојење мачке':isFlower?'Бојење љубичице':isFrog?'Бојење жабе':'Бојење рибе')+'"></canvas></div><div class="controls"><button class="secondary" id="resetart">Почни поново</button> <button class="primary" id="saveart">Сачувај слику</button> <button class="small" onclick="window.print()">Штампај</button></div><div class="feedback" id="feedback" role="status"></div></div>';$('#back').onclick=()=>nav('art');bindColors();const c=$('#fishPaint'),ctx=c.getContext('2d');let painting=false;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=14;ctx.globalAlpha=.7;if(state.art[key]){const saved=new Image();saved.onload=()=>{ctx.save();ctx.globalAlpha=1;ctx.drawImage(saved,0,0);ctx.restore()};saved.src=state.art[key]}function point(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{painting=true;c.setPointerCapture(e.pointerId);ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(...point(e));ctx.lineTo(...point(e).map((v,i)=>v+(i?0:.1)));ctx.stroke()};c.onpointermove=e=>{if(!painting)return;ctx.lineTo(...point(e));ctx.stroke()};function finish(){if(!painting)return;painting=false;state.art[key]=c.toDataURL();save()}c.onpointerup=finish;c.onpointercancel=finish;$('#resetart').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);delete state.art[key];save()};$('#saveart').onclick=()=>{const out=document.createElement('canvas');out.width=w;out.height=h;const o=out.getContext('2d');o.drawImage($('#paintFish'),0,0,w,h);const bee=document.querySelector('.fish-paint-wrap .flying-bee');if(bee){const r=c.getBoundingClientRect(),b=bee.getBoundingClientRect();o.drawImage(bee,(b.x-r.x)*w/r.width,(b.y-r.y)*h/r.height,b.width*w/r.width,b.height*h/r.height)}o.drawImage(c,0,0);out.toBlob(b=>{download(b,isCat?'moja-macka.png':isFlower?'moja-ljubicica.png':isFrog?'moja-zaba.png':'moja-riba.png');feedback('Слика је спремна за преузимање.')})}}
function coloring(kind){if(kind==='cat'||kind==='fish'||kind==='frog'||kind==='flower'){fishColoring(kind);return;}artKind=kind;app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Радионица</button><h2>Оживи слику бојама</h2></div><div class="workspace"><p>Изабери боју. Кликни део слике који желиш да обојиш.</p>'+palette()+svg(kind,true)+'<div class="controls"><button class="secondary" id="resetart">Почни поново</button> <button class="primary" id="saveart">Сачувај слику</button> <button class="small" onclick="window.print()">Штампај</button></div><div class="feedback" id="feedback" role="status"></div></div>';$('#back').onclick=()=>nav('art');bindColors();let regions=[...document.querySelectorAll('[data-paint]')];if(state.art[kind])regions.forEach((el,i)=>{if(state.art[kind][i])el.setAttribute('fill',state.art[kind][i])});regions.forEach(el=>el.onclick=()=>{el.setAttribute('fill',ink);state.art[kind]=regions.map(x=>x.getAttribute('fill'));save()});$('#resetart').onclick=()=>{delete state.art[kind];save();coloring(kind)};$('#saveart').onclick=()=>{download(new Blob([$('.colorart').outerHTML],{type:'image/svg+xml'}),'moja-slika.svg');feedback('Слика је спремна за преузимање.')}}
function draw(title){app.innerHTML='<div class="sectionhead"><button class="small" id="back">← Радионица</button><h2>'+title+'</h2></div><div class="workspace"><p>Цртај мишем или прстом. Испричај шта си нацртао.</p>'+palette()+'<div class="canvaswrap"><canvas id="drawing" width="900" height="540" aria-label="Површина за слободно цртање"></canvas></div><div class="controls"><button class="secondary" id="clear">Обриши</button> <button class="primary" id="saveart">Сачувај цртеж</button> <button class="small" onclick="window.print()">Штампај</button></div><div class="feedback" id="feedback" role="status"></div><p class="muted">Сачувај цртеж пре него што напустиш ову страницу.</p></div>';let d=setupCanvas();bindColors();$('#back').onclick=()=>nav('art');$('#clear').onclick=d.reset;$('#saveart').onclick=()=>$('#drawing').toBlob(blob=>{download(blob,'moj-crtez.png');feedback('Цртеж је спреман за преузимање.')})}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function progress(){let n=state.earned.length,done=letters.filter((l,i)=>state.earned.filter(x=>x.startsWith('l'+i+'-')).length===5).length;app.innerHTML='<div class="sectionhead"><h2>Моје мале победе</h2></div><div class="hero"><div><div class="eyebrow">СВАКА ВЕЖБА ЈЕ КОРАК НАПРЕД</div><h1>'+n+' звездица!</h1><p>Завршио си свих пет вежби за '+done+' слова. Вежбе можеш да поновиш кад год пожелиш.</p><div class="meter"><span style="width:'+n/155*100+'%"></span></div><p>'+n+' / 155 јединствених задатака</p></div>'+owlScene()+'</div><div class="sectionhead"><h2>Моје значке</h2></div><div class="badgegrid">'+[[1,'✿','Први корак'],[10,'☆','Истраживач'],[30,'♧','Мудра совица'],[75,'✦','Звездани путник'],[155,'★','Мајстор буквара']].map(([count,icon,name])=>'<div class="badge" style="opacity:'+(n>=count?1:.45)+'"><div style="font-size:40px">'+icon+'</div><strong>'+name+'</strong><p>'+ (n>=count?'Освојено!':count+' звездица')+'</p></div>').join('')+'</div><p class="muted">Напредак се чува на овом уређају у овом прегледачу.</p>'}
function parent(){app.innerHTML='<div class="sectionhead"><h2>За родитеље и наставнике</h2></div><div class="workspace" style="text-align:left"><h3>Мали кораци, без журбе</h3><p class="instructions">За узраст 3–4 године: бирајте слике, бојење и кратко слушање уз одраслог. За 5–6 година и прваке: додајте прво слово, парове великих и малих слова, слагање речи и писање. Узраст је смерница — пратите дететову спремност.</p><h3>Шта је преузето као основа?</h3><p class="instructions">Апликација прати редослед штампаних слова и речи са стр. 18–66 приложеног буквара. Садржи 150 задатака за слова, пет кратких прича са питањима, шест слика за бојење и слободно цртање. Илустрације су нове. Приче су кратке адаптације тема; апликација није потпуна дигитална верзија свих 160 страна и не обрађује писана слова.</p><h3>Рад без интернета</h3><p class="instructions">Сачувајте HTML датотеку на рачунар и отворите је у Chrome или Edge прегледачу. Игре, илустрације, видео у причи „Деда и репа“ и звучни сигнали раде без интернета. Речи и приче имају уграђене српске звучне снимке који раде и без интернета. Апликација пушта уграђене снимке са пријатним женским српским гласом и мирнијим темпом, без системског гласа. Звук покрећете дугметом за слушање или читање. Звук се активира кликом или додиром. Проверите да је „♫ Звук: да“ и да уређај није утишан. Нема пријављивања и огласа. Ако власник повеже статистику посета, објављени сајт шаље збирне посете и отварања категорија; имена, цртежи и резултати детета се не шаљу.</p><h3>Напредак и цртежи</h3><p class="instructions">Звездице и бојење се чувају у овом прегледачу ако је локално чување дозвољено. Слободне цртеже преузмите као PNG. Брисање података прегледача може обрисати напредак. Исто успешно решено питање не доноси нову звездицу. Писање је слободна вежба без аутоматске процене.</p><p id="storagestatus">'+(storageOK?'Локално чување је доступно.':'Локално чување није доступно — напредак ће трајати само током ове сесије.')+'</p><button class="secondary" id="export">Преузми напредак</button> <button class="small" id="resetprogress">Обриши напредак…</button><div class="feedback" id="feedback"></div><p class="source">Садржај заснован на приложеној датотеци 01-bukvar.pdf. Наслов у извору: „Буквар за први разред основне школе“. Примери речи и теме су образовна основа; нове активности не замењују рад са књигом и наставником.</p></div>';$('#export').onclick=()=>download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'bukvar-napredak.json');$('#resetprogress').onclick=()=>{if(confirm('Обрисати све звездице и сачуване боје на овом уређају?')){state.earned=[];state.art={};save();feedback('Напредак је обрисан.')}}}
const baseParent=parent;parent=function(){baseParent();renderAudioPanel();renderTrackingPanel()};


function renderAudioPanel(){let box=document.createElement('section');box.className='tracking-panel';box.innerHTML='<h3>Провери звук</h3><p>Кликни да чујеш пријатан сигнал или реч „мачка“. Оба дугмета укључују звук за пробу. Ако ништа не чујеш, провери јачину звука и утишане картице прегледача.</p><div class="controls" style="justify-content:flex-start"><button class="secondary" id="testChime">♫ Испробај сигнал</button><button class="primary" id="testVoice">Послушај „мачка“</button></div><p class="muted">Уграђени снимци користе женски српски глас Sophie са мирнијим темпом. Глас је компјутерски генерисан. Речи и приче раде без интернета и без инсталираног српског гласа.</p>';$('#app .workspace').append(box);$('#testChime').onclick=()=>{state.sound=true;save();stopAudio();unlockAudio();tone()};bindReader('мачка','#testVoice')}
document.addEventListener('pointerdown',unlockAudio,{capture:true,passive:true});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')unlockAudio()},{capture:true});

function renderSplash(){let el=$('#splash');el.innerHTML='<div class="splash-panel"><div class="eyebrow">МАЛЕ ИГРЕ · ВЕЛИКА ОТКРИЋА</div><button id="enterBukvar" class="splash-enter" aria-label="Отвори Буквар"><span class="splash-title-row" style="margin-top:28px">'+littleOwl('splash-owl')+'<span class="splash-title" aria-label="БУКВАР">'+'БУКВАР'.split('').map((c,i)=>'<span aria-hidden="true" style="--i:'+i+'">'+c+'</span>').join('')+'</span></span></button></div>';$('#brandOwl').innerHTML=littleOwl();$('#enterBukvar').onclick=()=>openApp('home');$('#showSplash').onclick=()=>{stopAudio();el.hidden=false;$('#siteShell').hidden=true;document.body.classList.add('splash-open');renderSplash();$('#enterBukvar').focus()}}
function openApp(where){$('#splash').hidden=true;$('#siteShell').hidden=false;document.body.classList.remove('splash-open');nav(where);if(where==='home'){trackEvent('enter-bukvar','Open Bukvar');tone();}let first=where==='home'?$('#start'):$('#app h2');if(first){first.tabIndex=-1;first.focus({preventScroll:true})}}
// Published analytics configuration: embed a GoatCounter site code with the parent export panel.
// Local visits are device-only. No names, drawings, typed text or learning results are sent.
let publishConfig={goatcounterCode:''};try{publishConfig=JSON.parse($('#publish-settings').textContent)}catch(e){}
let usage={loads:0,entries:0,sections:{}};try{usage={...usage,...JSON.parse(localStorage.getItem('bukvar-usage-v1')||'{}')}}catch(e){};if(!usage.sections||typeof usage.sections!=='object')usage.sections={};let trackingState='not-configured',eventQueue=[],lastSection=null;
function storeUsage(){try{localStorage.setItem('bukvar-usage-v1',JSON.stringify(usage))}catch(e){}}
function analyticsCode(v){return typeof v==='string'&&/^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$/.test(v)}
function isPublished(){return /^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1','[::1]'].includes(location.hostname)}
function setupTracking(){usage.loads=(Number(usage.loads)||0)+1;storeUsage();if(!analyticsCode(publishConfig.goatcounterCode))return;if(!isPublished()){trackingState='offline';return}if(navigator.globalPrivacyControl||navigator.doNotTrack==='1'){trackingState='privacy';return}trackingState='loading';window.goatcounter={no_onload:true,no_events:true,path:location.pathname,title:'Bukvar',referrer:()=>{try{return document.referrer?new URL(document.referrer).origin:''}catch(e){return ''}}};let js=document.createElement('script');js.async=true;js.src='https://gc.zgo.at/count.js';js.dataset.goatcounter='https://'+publishConfig.goatcounterCode+'.goatcounter.com/count';js.dataset.analytics='goatcounter';js.onload=()=>{if(typeof window.goatcounter?.count!=='function'){trackingState='blocked';return}trackingState='loaded';try{window.goatcounter.count({path:location.pathname,title:'Bukvar'})}catch(e){trackingState='blocked'}eventQueue.splice(0).forEach(e=>sendEvent(e));refreshTrackingStatus()};js.onerror=()=>{trackingState='blocked';eventQueue=[];refreshTrackingStatus()};document.head.append(js)}
function sendEvent(e){try{window.goatcounter.count({path:e.name,title:e.title,event:true,referrer:''})}catch(err){}}
function trackEvent(name,title){if(name==='enter-bukvar'){usage.entries=(Number(usage.entries)||0)+1;storeUsage()}if(!isPublished()||!analyticsCode(publishConfig.goatcounterCode)||trackingState==='privacy')return;let e={name,title};if(trackingState==='loaded')sendEvent(e);else if(trackingState==='loading'&&eventQueue.length<30)eventQueue.push(e)}
function trackSection(name){if(name===lastSection||!['home','letters','stories','art','progress'].includes(name))return;lastSection=name;usage.sections[name]=(Number(usage.sections[name])||0)+1;storeUsage();trackEvent('section-'+name,'Bukvar: '+name)}
function trackingLabel(){return ({'not-configured':'Јавна статистика још није повезана.','offline':'Повезан код је сачуван. Праћење почиње када HTML објавите на интернету.','privacy':'Прегледач је затражио приватност. Јавна статистика је прескочена.','loading':'Учитава се јавна статистика…','loaded':'Скрипта за јавну статистику је учитана. Резултате проверите у GoatCounter налогу.','blocked':'Статистика није учитана. Проверите везу и блокатор огласа.'})[trackingState]}
function refreshTrackingStatus(){if($('#trackingStatus'))$('#trackingStatus').textContent=trackingLabel()}
function renderTrackingPanel(){let box=document.createElement('section');box.className='tracking-panel';box.innerHTML='<h3>Посете и објављивање</h3><p>Ови бројеви су само за овај прегледач и уређај. Нису укупан број посетилаца објављеног сајта.</p><div class="stats-row"><div class="statbox"><strong>'+usage.loads+'</strong><small>Отварања на овом уређају</small></div><div class="statbox"><strong>'+usage.entries+'</strong><small>Уласци у Буквар</small></div></div><p class="tracking-status" id="trackingStatus"></p><p>За збирне посете свих уређаја: направите GoatCounter налог, унесите свој site code испод и преузмите HTML за објављивање. Код је први део адресе вашег налога, нпр. <strong>moj-bukvar</strong> у moj-bukvar.goatcounter.com. Преузети HTML садржи код за све посетиоце.</p><label for="trackingCode"><strong>GoatCounter site code</strong></label><input id="trackingCode" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="moj-bukvar" maxlength="60"><div class="controls" style="justify-content:flex-start"><button class="primary" id="publishDownload">Преузми HTML за објављивање</button><button class="secondary" id="usageDownload">Преузми локалну статистику</button></div><p role="status" id="publishMessage"></p><p>Јавна статистика бележи посете и категорије. Имена, цртежи и резултати детета остају на уређају. Ниједан налог се не повезује аутоматски.</p><p><a href="https://www.goatcounter.com/" target="_blank" rel="noopener noreferrer">Отвори GoatCounter</a> · <a href="https://www.goatcounter.com/help/start" target="_blank" rel="noopener noreferrer">Упутство за повезивање</a></p>';$('#app .workspace').append(box);$('#trackingCode').value=publishConfig.goatcounterCode||'';refreshTrackingStatus();$('#publishDownload').onclick=()=>{let code=$('#trackingCode').value.trim().toLowerCase();if(!analyticsCode(code)){$('#publishMessage').textContent='Унесите важећи site code: 3–60 малих латиничних слова, цифара или цртица; почетак и крај без цртице.';return}downloadPublished(code);$('#publishMessage').textContent='HTML са вашим кодом је преузет. Објавите тај фајл, па проверите посете у свом GoatCounter налогу.'};$('#usageDownload').onclick=()=>download(new Blob([JSON.stringify({scope:'this browser only',...usage},null,2)],{type:'application/json'}),'bukvar-local-usage.json')}
function publishedHTML(code){let clone=document.documentElement.cloneNode(true);clone.querySelector('#publish-settings').textContent=JSON.stringify({goatcounterCode:code});clone.querySelector('#app').innerHTML='';clone.querySelector('#splash').innerHTML='';clone.querySelector('#splash').hidden=false;clone.querySelector('#siteShell').hidden=true;clone.querySelector('body').className='splash-open';clone.querySelector('#stars').textContent='☆ 0';clone.querySelector('#live').textContent='';clone.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.nav==='home'));clone.querySelectorAll('script[data-analytics],.confetti,.toast').forEach(x=>x.remove());return '<!DOCTYPE html>\n'+clone.outerHTML}
function downloadPublished(code){download(new Blob([publishedHTML(code)],{type:'text/html;charset=utf-8'}),'index.html')}

document.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)});$('#sound').onclick=()=>{state.sound=!state.sound;if(state.sound){unlockAudio();tone()}else stopAudio();save()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#live').textContent='Приказ преко целог екрана није доступан.'}};header();home();setupTracking();renderSplash();
